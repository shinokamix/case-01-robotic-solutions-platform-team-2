name: robotics-platform

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: robotics
      POSTGRES_USER: robotics
      POSTGRES_PASSWORD: robotics
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U robotics -d robotics"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgres://robotics:robotics@postgres:5432/robotics?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    environment:
      API_ADDR: :8080
      DATABASE_URL: postgres://robotics:robotics@postgres:5432/robotics?sslmode=disable
      WEB_ORIGIN: http://localhost:${WEB_PORT:-5173}
      COOKIE_SECURE: "false"
      TRUSTED_PROXY_CIDRS: 172.16.0.0/12
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8080"]
      interval: 1s
      timeout: 2s
      retries: 60
    develop:
      watch:
        - action: sync
          path: ./apps/api
          target: /workspace/apps/api
          ignore:
            - .tmp/
            - go.mod
            - go.sum
        - action: rebuild
          path: ./apps/api/go.mod
        - action: rebuild
          path: ./apps/api/go.sum
        - action: sync
          path: ./packages/contracts
          target: /workspace/packages/contracts

  admin:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: admin
    environment:
      DATABASE_URL: postgres://robotics:robotics@postgres:5432/robotics?sslmode=disable
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME:-}
      ADMIN_LAST_NAME: ${ADMIN_LAST_NAME:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    stdin_open: true
    tty: true

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    environment:
      API_PROXY_TARGET: http://api:8080
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./apps/web
          target: /workspace/apps/web
          ignore:
            - node_modules/
            - package.json
            - package-lock.json
        - action: rebuild
          path: ./apps/web/package.json
        - action: rebuild
          path: ./apps/web/package-lock.json

volumes:
  postgres-data:
