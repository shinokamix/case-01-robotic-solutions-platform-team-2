name: robotics-platform-auth-test

services:
  postgres-test:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: robotics_test
      POSTGRES_USER: robotics
      POSTGRES_PASSWORD: robotics
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U robotics -d robotics_test"]
      interval: 1s
      timeout: 3s
      retries: 30

  auth-test:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    environment:
      DATABASE_URL: postgres://robotics:robotics@postgres-test:5432/robotics_test?sslmode=disable
      TEST_DATABASE_URL: postgres://robotics:robotics@postgres-test:5432/robotics_test?sslmode=disable
      ADMIN_EMAIL: admin@example.test
      ADMIN_PASSWORD: integration-admin-password
      ADMIN_FIRST_NAME: Системный
      ADMIN_LAST_NAME: Администратор
    depends_on:
      postgres-test:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - |
        go run ./cmd/migrate
        go run ./cmd/admin create
        go run ./cmd/admin create
        go test ./tests/integration -count=1 -v
