name: spec-driven
version: 1
description: "Короткий цикл OpenSpec: specs → tasks"
artifacts:
  - id: specs
    generates: "specs/**/*.md"
    description: Требования, сценарии и общие контракты изменения
    template: spec.md
    instruction: |
      Создай спецификации проверяемого поведения системы.

      Сначала прочитай запрос пользователя и существующие спецификации. Если
      неясность влияет на поведение или общий контракт, запроси решение у
      пользователя до записи файлов.

      Для технического изменения сохраняй текущее наблюдаемое поведение вне
      явно изменяемой области.

      Раздели изменение по возможностям продукта. Не создавай отдельные
      возможности для слоев реализации. Например, используй
      `economics-calculation` вместо `frontend-calculator` и
      `backend-calculator`.

      Создай отдельный файл для каждой затронутой возможности:
      `specs/<capability-path>/spec.md`. Для новых частей пути используй
      kebab-case. Для существующей возможности возьми точный путь из
      `<planningHome.root>/openspec/specs/`.

      Для новой возможности начни файл с `## Purpose`. Опиши проблему и
      ожидаемый результат. Укажи, какое поведение входит в возможность и какое
      не входит. Если возможность решает задачу человека или внешней роли,
      добавь одну основную user story в формате "Как <роль>, я хочу <действие>,
      чтобы <результат>". Для инфраструктурной или внутренней возможности не
      придумывай user story. Для существующей возможности не добавляй
      `## Purpose`.

      Описывай в одном требовании одно обязательное поведение. Если к поведению
      относятся входные данные, выходные данные, ошибки или внешние ограничения,
      добавь их в то же требование. Помещай общие соглашения в требование,
      которое они уточняют.

      Записывай техническое решение, только если оно задает общий контракт
      между частями системы. Общим контрактом может быть формат данных, формула,
      единица измерения, правило округления или источник истины. Если контракт
      можно проверить на контрольном примере, добавь этот пример. Пошаговую
      реализацию вынеси в `tasks.md`.

      Пиши описания, новые названия требований и сценарии по-русски. Сохрани
      служебные заголовки OpenSpec на английском:
      - `## ADDED Requirements` для новых требований
      - `## MODIFIED Requirements` для измененного поведения
      - `## REMOVED Requirements` для удаленного поведения
      - `## RENAMED Requirements` только для переименования

      Удаляй секцию, если в ней нет записей. Удаляй необязательное поле,
      если для него нет данных. Не оставляй заполнители `<...>`.

      Оформляй каждое новое или измененное требование как
      `### Requirement: <название>`. Первое предложение пиши в формате
      `<точное имя компонента или интерфейса> MUST <проверяемое поведение>`.
      Используй имя из запроса пользователя, существующей спецификации или
      кодовой базы.

      Добавь к каждому новому или измененному требованию хотя бы один сценарий
      `#### Scenario: <название>`. Используй ровно четыре символа `#`. Название
      должно отличать этот случай от других сценариев требования. В пункте
      `КОГДА` укажи одно событие или действие. В пункте `ТОГДА` укажи один
      наблюдаемый результат. Если результат зависит от начального состояния,
      добавь `ДАНО` перед `КОГДА`. Если ошибка или граничный случай дает другой
      результат, создай отдельный сценарий.

      При изменении требования найди его в основной спецификации. Скопируй под
      `## MODIFIED Requirements` весь блок от `### Requirement:` до конца всех
      его сценариев. Затем измени копию. Не удаляй сценарии, которые остаются
      действующими. OpenSpec отклоняет блок `MODIFIED`, если в нем нет
      действующего сценария из основной спецификации.

      Для удаленного требования скопируй точное название из основной
      спецификации. После названия добавь строки `**Reason**: <причина>` и
      `**Migration**: <переход>`. В `**Migration**` укажи замену или действие
      для перехода. Если переход не нужен, напиши об этом прямо.

      Для переименования используй две строки:
      - `FROM:` со значением `### Requirement: <старое название>`
      - `TO:` со значением `### Requirement: <новое название>`

      Не помещай одно требование одновременно в секции `ADDED`, `MODIFIED` и
      `REMOVED`. Если переименование также меняет поведение, добавь блок
      `MODIFIED` с новым названием требования.

      Если изменение не добавляет, не изменяет, не удаляет и не переименовывает
      требования, установи `skip_specs: true` в `.openspec.yaml`. Например,
      создание структуры репозитория само по себе не требует спецификации. Если
      структура задает проверяемое соглашение, опиши это соглашение. Не
      придумывай требование или user story ради успешной проверки.

      После записи файлов запусти
      `openspec validate <change-name> --strict --no-interactive`. Исправь все
      ошибки до создания `tasks.md`.
    requires: []

  - id: tasks
    generates: tasks.md
    description: Проверяемый план реализации
    template: tasks.md
    instruction: |
      Прочитай запрос пользователя и все спецификации изменения. Создай
      выполнимый план реализации в `tasks.md`.

      Если неясность меняет поведение, общий контракт, обязательный объем или
      критический путь, сначала запроси решение у пользователя. Незначительную
      деталь выбери сам и запиши в соответствующей задаче.

      Соблюдай формат, который читает apply:
      - начни документ с `# План реализации`;
      - группируй задачи под нумерованными заголовками `##`;
      - называй этап по результату или сквозному сценарию;
      - начинай каждую задачу с `- [ ] X.Y [<владелец>]`, где владелец обозначен
        идентификатором `frontend`, `backend`, `ml` или `infra`;
      - назначай каждой задаче одного основного владельца;
      - описывай после владельца один завершенный результат;
      - добавляй вложенную строку `Проверка:` с командой или наблюдаемым
        результатом;
      - добавляй к каждой задаче вложенную строку `Зависит от:` с номерами задач
        или значением `нет`;
      - удаляй все заполнители `<...>` из готового файла.

      Располагай этапы и задачи в порядке зависимостей. Группируй работу по
      пользовательским сценариям или общим контрактам, а не по владельцам.
      Разные владельцы должны иметь возможность вести независимые задачи
      параллельно.

      Отдельная задача на проверку нужна только для интеграционного сценария,
      который охватывает несколько задач.
    requires:
      - specs

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    Прочитай спецификации и список задач. Выполняй незакрытые задачи по порядку
    и сразу отмечай завершенные. Остановись, если реализация требует изменить
    согласованное поведение или общий контракт.
